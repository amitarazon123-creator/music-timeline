<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Host Screen</title>
</head>
<body>
  <h1>HOST SCREEN</h1>

  <button id="createRoomBtn">Create Room</button>

  <div id="roomSection" hidden>
    <h2>Room Code: <span id="roomCode">----</span></h2>

    <div id="winLengthSection">
      <label for="winLengthSelect">Songs to win:</label>
      <select id="winLengthSelect">
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="8">8</option>
        <option value="10" selected>10</option>
      </select>
      <p id="winLengthStatus"></p>
    </div>

    <div id="spotifyLoginSection">
      <a id="spotifyLoginLink" href="#">Login with Spotify</a>
      <p id="spotifyStatus"></p>
    </div>

    <div id="spotifyConnectedSection" hidden>
      <p>Spotify connected</p>
      <input id="playlistUrlInput" type="text" placeholder="Spotify playlist link" />
      <button id="loadPlaylistBtn">Load Playlist</button>
      <button id="clearPlaylistBtn">Clear Playlist</button>
      <p id="playlistStatus"></p>

      <button id="playRandomSongBtn" hidden>Play Random Song</button>
      <button id="pauseBtn" hidden>Pause</button>
      <button id="revealBtn" hidden>Reveal</button>
      <button id="startNewGameBtn" hidden>Start New Game</button>
      <p id="turnStatus"></p>
      <p id="playStatus"></p>
      <p id="guessProgress"></p>
      <p id="revealResult"></p>

      <div id="tokenAwardSection" hidden>
        <p>Did <span id="tokenAwardNickname"></span> correctly name the song and artist too?</p>
        <button id="awardTokenBtn">Award Steal Token</button>
        <button id="skipTokenBtn">No Token</button>
      </div>

      <p id="premiumError" hidden style="color: red;">Spotify Premium is required to host a game.</p>
    </div>

    <h3>Players</h3>
    <ul id="playerList"></ul>
  </div>

  <!-- Socket.io serves this file automatically, no need to install anything client-side -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Lets the browser become a controllable Spotify playback device -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    const socket = io();
    let roomCode = null;

    // Web Playback SDK state
    let sdkReady = false;
    let spotifyConnected = false;
    let playlistLoaded = false;
    let deviceId = null;
    let player = null;
    let remainingSongs = 0;

    // Called by the SDK's own script tag once it's finished loading
    window.onSpotifyWebPlaybackSDKReady = () => {
      sdkReady = true;
      tryInitPlayer();
    };

    // Creates the Spotify.Player once we know both the SDK has loaded and the
    // host has connected their Spotify account (order between the two varies).
    function tryInitPlayer() {
      if (!sdkReady || !spotifyConnected || !roomCode || player) return;

      player = new Spotify.Player({
        name: 'Music Timeline Host',
        volume: 0.8,
        // The SDK calls this every time it needs a fresh token; the server
        // refreshes it under the hood if the stored one has expired.
        getOAuthToken: (callback) => {
          fetch(`/token?room=${roomCode}`)
            .then((res) => res.json())
            .then((data) => callback(data.accessToken))
            .catch((err) => console.error('Failed to fetch token:', err));
        },
      });

      player.addListener('ready', ({ device_id }) => {
        deviceId = device_id;
        updatePlayButtonVisibility();
      });

      player.addListener('not_ready', ({ device_id }) => {
        if (device_id === deviceId) deviceId = null;
      });

      // Fires when the logged-in account isn't Premium (or otherwise can't stream)
      player.addListener('account_error', () => {
        document.getElementById('premiumError').hidden = false;
      });

      player.addListener('initialization_error', ({ message }) => {
        console.error('Spotify player initialization error:', message);
      });

      player.addListener('authentication_error', ({ message }) => {
        console.error('Spotify player authentication error:', message);
      });

      player.connect();
    }

    function updatePlayButtonVisibility() {
      const btn = document.getElementById('playRandomSongBtn');
      btn.hidden = !(playlistLoaded && deviceId);
      btn.disabled = remainingSongs <= 0;
    }

    socket.on('connect', () => {
      console.log('connected');
    });

    function renderPlayerList(players) {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach((p) => {
        const li = document.createElement('li');
        li.textContent = `${p.nickname} (${p.tokens} steal token${p.tokens === 1 ? '' : 's'})`;
        list.appendChild(li);
      });
    }

    function showRoom() {
      document.getElementById('roomCode').textContent = roomCode;
      document.getElementById('roomSection').hidden = false;
    }

    document.getElementById('createRoomBtn').addEventListener('click', () => {
      socket.emit('createRoom', (response) => {
        roomCode = response.code;
        showRoom();
      });
    });

    document.getElementById('spotifyLoginLink').addEventListener('click', (event) => {
      event.preventDefault();
      window.location.href = `/login?room=${roomCode}`;
    });

    document.getElementById('winLengthSelect').addEventListener('change', (event) => {
      const winLength = event.target.value;
      socket.emit('setWinLength', { roomCode, winLength }, (response) => {
        document.getElementById('winLengthStatus').textContent = response.error || `Win length set to ${winLength}.`;
      });
    });

    socket.on('winLengthUpdated', ({ winLength }) => {
      document.getElementById('winLengthSelect').value = winLength;
    });

    socket.on('starterCardsDealt', ({ dealt }) => {
      const summary = dealt.map((d) => `${d.nickname}: ${d.song.year} - ${d.song.name}`).join(', ');
      document.getElementById('revealResult').textContent = `Starter cards - ${summary}`;
    });

    document.getElementById('loadPlaylistBtn').addEventListener('click', () => {
      const playlistUrl = document.getElementById('playlistUrlInput').value.trim();
      const status = document.getElementById('playlistStatus');

      if (!playlistUrl) {
        status.textContent = 'Paste a playlist link first.';
        return;
      }

      status.textContent = 'Loading...';

      socket.emit('loadPlaylist', { roomCode, playlistUrl }, (response) => {
        if (response.error) {
          status.textContent = response.error;
        } else {
          status.textContent = `${response.added} new song${response.added === 1 ? '' : 's'} added (${response.count} total in bank, ${response.remaining} playable)`;
          playlistLoaded = response.count > 0;
          remainingSongs = response.remaining;
          updatePlayButtonVisibility();
        }
      });
    });

    document.getElementById('clearPlaylistBtn').addEventListener('click', () => {
      const status = document.getElementById('playlistStatus');

      socket.emit('clearPlaylist', { roomCode }, (response) => {
        if (response.error) {
          status.textContent = response.error;
          return;
        }
        status.textContent = 'Song bank cleared. Load a playlist to keep playing.';
        playlistLoaded = false;
        remainingSongs = response.remaining;
        updatePlayButtonVisibility();
      });
    });

    document.getElementById('playRandomSongBtn').addEventListener('click', () => {
      const btn = document.getElementById('playRandomSongBtn');
      const status = document.getElementById('playStatus');

      // Disabled immediately (not just after the server responds) so a second
      // click can't slip in while this request is still in flight.
      btn.disabled = true;
      status.textContent = 'Picking a song...';

      socket.emit('playRandomSong', { roomCode }, async (response) => {
        if (response.error) {
          status.textContent = response.error;
          btn.disabled = remainingSongs <= 0;
          return;
        }

        // First click of a fresh game just deals starter cards - no round
        // started yet, so there's nothing to play on Spotify.
        if (response.dealt) {
          remainingSongs = response.remaining;
          status.textContent = remainingSongs > 0
            ? 'Starter cards dealt! Click Play Random Song again to start round 1.'
            : 'Starter cards dealt, but the pool is now empty - load more songs before round 1.';
          btn.disabled = remainingSongs <= 0;
          return;
        }

        remainingSongs = response.remaining;
        if (remainingSongs === 0) {
          document.getElementById('playlistStatus').textContent = 'Song pool is empty - load a playlist to keep playing after this round.';
        }
        document.getElementById('turnStatus').textContent = `${response.activeNickname}'s turn to guess.`;
        document.getElementById('guessProgress').textContent = '';
        document.getElementById('revealResult').textContent = '';
        document.getElementById('revealBtn').hidden = true;

        try {
          const tokenRes = await fetch(`/token?room=${roomCode}`);
          const { accessToken } = await tokenRes.json();

          const playRes = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
            method: 'PUT',
            headers: {
              Authorization: `Bearer ${accessToken}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ uris: [response.uri] }),
          });

          if (!playRes.ok) {
            throw new Error(`Spotify playback request failed (${playRes.status})`);
          }

          status.textContent = 'Playing...';
          document.getElementById('pauseBtn').hidden = false;
        } catch (err) {
          console.error('Failed to start playback:', err);
          status.textContent = 'Failed to start Spotify playback - the round can still proceed once bets are in.';
        }
      });
    });

    // The active player locked in their bet - steal window is now open for
    // everyone else. Reveal stays hidden until every decision is in.
    socket.on('stealWindowOpened', ({ activeNickname }) => {
      document.getElementById('turnStatus').textContent = `${activeNickname} locked in their bet. Waiting on steal decisions...`;
      document.getElementById('revealBtn').hidden = true;
    });

    socket.on('stealProgress', ({ decided, total, complete }) => {
      document.getElementById('guessProgress').textContent = total === 0
        ? 'No one else can steal this round.'
        : `${decided}/${total} players have decided`;
      document.getElementById('revealBtn').hidden = !complete;
    });

    document.getElementById('revealBtn').addEventListener('click', () => {
      socket.emit('revealSong', { roomCode }, (response) => {
        if (response.error) {
          document.getElementById('revealResult').textContent = response.error;
        }
      });
    });

    socket.on('roundResult', ({ song, activePlayerId, activeNickname, activeCorrect, stealResults, tokenEligible, winners }) => {
      let text = `${song.name} (${song.artists}), ${song.year} - `;

      if (activeCorrect) {
        text += `${activeNickname} got it right!`;
      } else {
        const stealers = stealResults.filter((result) => result.correct);
        text += stealers.length > 0
          ? `${activeNickname} missed it, but ${stealers.map((result) => result.nickname).join(' & ')} stole it!`
          : `${activeNickname} missed it, and nobody stole it.`;
      }

      if (winners && winners.length > 0) {
        text += ` — ${winners.join(' & ')} ${winners.length > 1 ? 'win' : 'wins'} the game!`;
        document.getElementById('playRandomSongBtn').hidden = true;
        document.getElementById('startNewGameBtn').hidden = false;
      } else {
        document.getElementById('playRandomSongBtn').disabled = remainingSongs <= 0;
      }

      document.getElementById('revealResult').textContent = text;
      document.getElementById('revealBtn').hidden = true;
      document.getElementById('guessProgress').textContent = '';

      if (tokenEligible) {
        document.getElementById('tokenAwardNickname').textContent = activeNickname;
        document.getElementById('tokenAwardSection').hidden = false;
        document.getElementById('tokenAwardSection').dataset.playerId = activePlayerId;
      }
    });

    document.getElementById('awardTokenBtn').addEventListener('click', () => {
      const playerId = document.getElementById('tokenAwardSection').dataset.playerId;
      socket.emit('awardStealToken', { roomCode, playerId }, () => {
        document.getElementById('tokenAwardSection').hidden = true;
      });
    });

    document.getElementById('skipTokenBtn').addEventListener('click', () => {
      document.getElementById('tokenAwardSection').hidden = true;
    });

    document.getElementById('startNewGameBtn').addEventListener('click', () => {
      // The winning round's song may still be audibly playing - stop it now,
      // since the pause button is about to disappear along with everything
      // else from the finished game.
      if (player) {
        player.pause().catch((err) => console.error('Failed to pause playback:', err));
      }

      socket.emit('startNewGame', { roomCode }, (response) => {
        if (response.error) {
          document.getElementById('revealResult').textContent = response.error;
        }
      });
    });

    // Server confirms the reset to everyone in the room (host included).
    socket.on('newGameStarted', ({ remaining }) => {
      remainingSongs = remaining;
      document.getElementById('startNewGameBtn').hidden = true;
      document.getElementById('revealBtn').hidden = true;
      document.getElementById('pauseBtn').hidden = true;
      document.getElementById('tokenAwardSection').hidden = true;
      document.getElementById('turnStatus').textContent = '';
      document.getElementById('playStatus').textContent = '';
      document.getElementById('guessProgress').textContent = '';
      document.getElementById('revealResult').textContent = 'New game started!';
      updatePlayButtonVisibility();
    });

    document.getElementById('pauseBtn').addEventListener('click', () => {
      const status = document.getElementById('playStatus');

      // player.pause() controls this SDK instance directly, no Web API call needed
      player
        .pause()
        .then(() => {
          status.textContent = 'Paused.';
        })
        .catch((err) => {
          console.error('Failed to pause playback:', err);
          status.textContent = 'Failed to pause playback.';
        });
    });

    // Fired by the server whenever a player joins, leaves, or their token count changes
    socket.on('playerListUpdate', renderPlayerList);

    // If Spotify just redirected us back here, ?room= and ?spotify= will be set in the URL
    const params = new URLSearchParams(window.location.search);
    const spotifyResult = params.get('spotify');
    const paramRoom = params.get('room');

    if (paramRoom) {
      roomCode = paramRoom;
      showRoom();

      // The page just fully reloaded, so this is a new socket connection - rejoin the
      // room's channel so we keep getting live player list updates.
      socket.emit('hostRejoin', roomCode, (response) => {
        if (response && response.players) {
          renderPlayerList(response.players);
        }
        if (response && response.winLength) {
          document.getElementById('winLengthSelect').value = response.winLength;
        }
      });
    }

    if (spotifyResult === 'connected') {
      document.getElementById('spotifyLoginSection').hidden = true;
      document.getElementById('spotifyConnectedSection').hidden = false;
      spotifyConnected = true;
      tryInitPlayer();
    } else if (spotifyResult === 'error') {
      document.getElementById('spotifyStatus').textContent = 'Spotify connection failed. Please try again.';
    }
  </script>
</body>
</html>
