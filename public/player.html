<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player Screen</title>
</head>
<body>
  <h1>PLAYER SCREEN</h1>

  <form id="joinForm">
    <input id="roomCodeInput" type="text" placeholder="Room Code" />
    <input id="nicknameInput" type="text" placeholder="Nickname" />
    <button type="submit">Join</button>
  </form>

  <p id="status"></p>

  <div id="gameSection" hidden>
    <p>Steal tokens: <span id="tokenCount">0</span></p>

    <h3>Your Timeline</h3>
    <ol id="timelineList"></ol>

    <div id="waitingSection">
      <p>Waiting for the next song...</p>
    </div>

    <div id="guessSection" hidden>
      <p id="guessPrompt">A song is playing! Where does it belong on your timeline?</p>
      <select id="positionSelect"></select>
      <button id="submitGuessBtn">Lock In Guess</button>
    </div>

    <div id="stealSection" hidden>
      <p id="stealPrompt">Someone else's turn. Want to try to steal it?</p>
      <select id="stealPositionSelect"></select>
      <button id="submitStealBtn">Steal (costs 1 token)</button>
      <button id="passStealBtn">Don't Steal</button>
    </div>

    <div id="resultSection" hidden>
      <p id="resultText"></p>
    </div>
  </div>

  <!-- Socket.io serves this file automatically, no need to install anything client-side -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let roomCode = null;
    let timeline = [];
    let hasGuessed = false;
    let myNickname = null;
    let tokens = 0;

    socket.on('connect', () => {
      console.log('connected');
    });

    function setTokens(count) {
      tokens = count;
      document.getElementById('tokenCount').textContent = tokens;
    }

    function renderTimeline() {
      const list = document.getElementById('timelineList');
      list.innerHTML = '';
      timeline.forEach((song) => {
        const li = document.createElement('li');
        li.textContent = `${song.year} - ${song.name} (${song.artists})`;
        list.appendChild(li);
      });
    }

    // Builds one dropdown option per gap in a timeline (before the first
    // card, between each pair, and after the last one). Skips the gap between
    // two cards that share a year - it's always redundant, since whenever
    // it's a correct guess, both of its neighboring gaps are correct too.
    // `allowedIndices`, if given, further restricts which gaps show up (used
    // for steal attempts, where some of the active player's gaps are off
    // limits).
    function renderGapOptions(selectEl, refTimeline, allowedIndices) {
      selectEl.innerHTML = '';

      for (let i = 0; i <= refTimeline.length; i++) {
        if (i > 0 && i < refTimeline.length && refTimeline[i - 1].year === refTimeline[i].year) continue;
        if (allowedIndices && !allowedIndices.includes(i)) continue;

        const option = document.createElement('option');
        option.value = i;
        if (refTimeline.length === 0) {
          option.textContent = 'Only card';
        } else if (i === 0) {
          option.textContent = `Before ${refTimeline[0].year}`;
        } else if (i === refTimeline.length) {
          option.textContent = `After ${refTimeline[refTimeline.length - 1].year}`;
        } else {
          option.textContent = `Between ${refTimeline[i - 1].year} and ${refTimeline[i].year}`;
        }
        selectEl.appendChild(option);
      }
    }

    function hideAllRoundSections() {
      document.getElementById('waitingSection').hidden = true;
      document.getElementById('guessSection').hidden = true;
      document.getElementById('stealSection').hidden = true;
      document.getElementById('resultSection').hidden = true;
    }

    document.getElementById('joinForm').addEventListener('submit', (event) => {
      event.preventDefault();

      const status = document.getElementById('status');
      const code = document.getElementById('roomCodeInput').value;
      const nickname = document.getElementById('nicknameInput').value.trim();

      if (!nickname) {
        status.textContent = 'Nickname is required.';
        return;
      }

      socket.emit('joinRoom', { code, nickname }, (response) => {
        if (response.error) {
          status.textContent = response.error;
        } else {
          status.textContent = `Joined room ${response.code} as ${nickname}`;
          roomCode = response.code;
          myNickname = nickname;
          timeline = response.timeline || [];
          setTokens(response.tokens || 0);
          renderTimeline();
          document.getElementById('gameSection').hidden = false;
          document.getElementById('joinForm').hidden = true;
        }
      });
    });

    // A fresh game deals everyone one free starter card before round 1 begins.
    socket.on('starterCardsDealt', ({ dealt }) => {
      const mine = dealt.find((d) => d.playerId === socket.id);
      if (!mine) return;

      timeline = [mine.song];
      renderTimeline();

      hideAllRoundSections();
      document.getElementById('waitingSection').hidden = false;
      document.getElementById('waitingSection').querySelector('p').textContent =
        `You got a starter card: ${mine.song.year} - ${mine.song.name}. Waiting for round 1...`;
    });

    // Server tells us a song started playing without revealing what it is.
    // Only the active player bets right now - everyone else waits to see the
    // steal window open once that bet is locked in.
    socket.on('roundStarted', ({ activePlayerId, activeNickname }) => {
      hasGuessed = false;
      hideAllRoundSections();

      if (activePlayerId === socket.id) {
        renderGapOptions(document.getElementById('positionSelect'), timeline);
        document.getElementById('guessPrompt').textContent = 'Your turn! Where does it belong on your timeline?';
        document.getElementById('guessSection').hidden = false;
      } else {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent =
          `${activeNickname}'s turn - waiting for their bet...`;
      }
    });

    document.getElementById('submitGuessBtn').addEventListener('click', () => {
      if (hasGuessed) return;

      const position = Number(document.getElementById('positionSelect').value);
      socket.emit('submitGuess', { roomCode, position }, (response) => {
        if (response.error) {
          alert(response.error);
          return;
        }
        hasGuessed = true;
        document.getElementById('guessSection').hidden = true;
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Bet locked in - waiting for reveal...';
      });
    });

    // Active player's bet is in. Everyone else now gets a real (non-blind)
    // choice: spend a steal token on one of the active player's OWN timeline
    // gaps (their chosen gap and its neighbors are reserved - "the borders
    // are in their favor"), or pass for free.
    socket.on('stealWindowOpened', ({ activePlayerId, activeNickname, activeTimeline, stealOptions }) => {
      hideAllRoundSections();

      if (activePlayerId === socket.id) {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Bet locked in - waiting for reveal...';
        return;
      }

      if (stealOptions.length === 0) {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent =
          `${activeNickname}'s bet covers their whole timeline - nothing left to steal this round.`;
        return;
      }

      document.getElementById('stealPrompt').textContent =
        `${activeNickname} placed their bet. Steal one of the remaining spots on their timeline (costs 1 token) or let it ride.`;

      const select = document.getElementById('stealPositionSelect');
      select.innerHTML = '';
      stealOptions.forEach(({ index, label }) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = label;
        select.appendChild(option);
      });

      document.getElementById('submitStealBtn').disabled = tokens <= 0;
      document.getElementById('stealSection').hidden = false;
    });

    document.getElementById('submitStealBtn').addEventListener('click', () => {
      const position = Number(document.getElementById('stealPositionSelect').value);

      socket.emit('submitSteal', { roomCode, position }, (response) => {
        if (response.error) {
          alert(response.error);
          return;
        }
        setTokens(response.tokens);
        document.getElementById('stealSection').hidden = true;
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Steal attempt locked in - waiting for reveal...';
      });
    });

    document.getElementById('passStealBtn').addEventListener('click', () => {
      socket.emit('passSteal', { roomCode }, (response) => {
        if (response.error) {
          alert(response.error);
          return;
        }
        document.getElementById('stealSection').hidden = true;
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Waiting for reveal...';
      });
    });

    socket.on('roundResult', ({ song, activePlayerId, activeNickname, activeCorrect, activeTimeline, stealResults, winners }) => {
      hideAllRoundSections();

      if (socket.id === activePlayerId) {
        timeline = activeTimeline;
        renderTimeline();
        document.getElementById('resultText').textContent = activeCorrect
          ? `Correct! ${song.name} (${song.artists}) - ${song.year}`
          : `You missed it. ${song.name} (${song.artists}) was actually from ${song.year}.`;
      } else {
        const mine = stealResults.find((result) => result.playerId === socket.id);

        if (mine) {
          timeline = mine.timeline;
          renderTimeline();
        }

        if (activeCorrect) {
          document.getElementById('resultText').textContent = mine
            ? `${activeNickname} got it right - your steal attempt didn't get a chance. Token spent.`
            : `${activeNickname} got it right! ${song.name} (${song.artists}) - ${song.year}`;
        } else if (mine && mine.correct) {
          document.getElementById('resultText').textContent = `You stole it! ${song.name} (${song.artists}) - ${song.year}`;
        } else if (mine) {
          document.getElementById('resultText').textContent = `Steal failed. ${activeNickname} also missed it, but ${song.year} wasn't your guess. Token spent.`;
        } else {
          document.getElementById('resultText').textContent = `${activeNickname} missed it. ${song.name} (${song.artists}) - ${song.year}`;
        }
      }

      document.getElementById('resultSection').hidden = false;
      document.getElementById('waitingSection').hidden = false;

      let waitingText = 'Waiting for the next turn...';
      if (winners && winners.length > 0) {
        waitingText = winners.includes(myNickname)
          ? 'You won the game!'
          : `${winners.join(' & ')} won the game!`;
      }
      document.getElementById('waitingSection').querySelector('p').textContent = waitingText;
    });

    // Pushed by the server when the host approves a steal token after a
    // correct, correctly-named turn.
    socket.on('tokensUpdated', ({ tokens: newTokens }) => {
      setTokens(newTokens);
    });

    // Server resets everyone's view when the host starts a new game.
    socket.on('newGameStarted', () => {
      timeline = [];
      hasGuessed = false;
      setTokens(0);
      renderTimeline();
      hideAllRoundSections();
      document.getElementById('waitingSection').hidden = false;
      document.getElementById('waitingSection').querySelector('p').textContent = 'New game started - waiting for the next song...';
    });
  </script>
</body>
</html>
