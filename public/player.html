<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Screen</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>Music Timeline</h1>

  <div class="wrap">
    <form id="joinForm" class="card stack">
      <input id="roomCodeInput" type="text" placeholder="Room Code" autocomplete="off" autocapitalize="characters" />
      <input id="nicknameInput" type="text" placeholder="Nickname" autocomplete="off" />
      <button type="submit">Join Room</button>
    </form>

    <p id="status" class="status-text center-text"></p>

    <div id="gameSection" hidden class="stack">
      <div class="card row" style="justify-content: space-between;">
        <h3 style="margin: 0;">Your Timeline</h3>
        <span class="badge"><span class="dot"></span> <span id="tokenCount">0</span> token(s)</span>
      </div>

      <ol id="timelineList" class="card"></ol>

      <div id="waitingSection" class="card center-text muted">
        <p>Waiting for the next song...</p>
      </div>

      <div id="guessSection" hidden class="card stack">
        <p id="guessPrompt">A song is playing! Where does it belong on your timeline?</p>
        <div id="positionOptions" class="stack"></div>
        <button id="submitGuessBtn" disabled>Lock In Guess</button>
      </div>

      <div id="stealSection" hidden class="card stack">
        <p id="stealPrompt">Someone else's turn. Want to try to steal it?</p>
        <div id="stealPositionOptions" class="stack"></div>
        <button id="submitStealBtn" disabled>Steal (costs 1 token)</button>
        <button id="passStealBtn" class="secondary">Don't Steal</button>
      </div>

      <div id="resultSection" hidden class="card">
        <p id="resultText"></p>
      </div>
    </div>
  </div>

  <!-- Deliberately outside .wrap's card stack and pushed well down the page,
       away from the guess/steal buttons, so it can't get bumped by accident
       mid-game - this is a rare, deliberate action, not a frequent one. -->
  <div class="wrap" style="margin-top: 56px;">
    <button id="leaveRoomBtn" hidden class="secondary" style="width: auto; padding: 8px 18px; font-size: 0.8rem; opacity: 0.7; margin: 0 auto; display: block;">Leave Room</button>
  </div>

  <!-- Socket.io serves this file automatically, no need to install anything client-side -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let roomCode = null;
    let playerId = null;
    let timeline = [];
    let hasGuessed = false;
    let myNickname = null;
    let tokens = 0;

    // Persisted so a page reload or dropped connection can rejoin as the same
    // player (same timeline/tokens/turn order) instead of starting over.
    function saveSession(rCode, pId) {
      localStorage.setItem('mt_roomCode', rCode);
      localStorage.setItem('mt_playerId', pId);
    }

    function clearSession() {
      localStorage.removeItem('mt_roomCode');
      localStorage.removeItem('mt_playerId');
    }

    // Without this, a player whose host started a fresh room elsewhere had no
    // way back to the join form at all - the saved room still technically
    // exists (rooms are never deleted), so the auto-rejoin below would just
    // keep silently placing them back into it, host-less, forever. A plain
    // reload after clearing is the simplest way back to a clean join screen.
    document.getElementById('leaveRoomBtn').addEventListener('click', () => {
      clearSession();
      location.reload();
    });

    function enterGame(nickname, restoredTimeline, restoredTokens) {
      myNickname = nickname;
      timeline = restoredTimeline || [];
      setTokens(restoredTokens || 0);
      renderTimeline();
      document.getElementById('gameSection').hidden = false;
      document.getElementById('joinForm').hidden = true;
      document.getElementById('leaveRoomBtn').hidden = false;
    }

    socket.on('connect', () => {
      console.log('connected');
      attemptRejoin();
    });

    function setTokens(count) {
      tokens = count;
      document.getElementById('tokenCount').textContent = tokens;
    }

    // Maps a song's year onto a single sweep of the rainbow (oldest = red,
    // newest = violet) instead of a fixed lookup table, so it never needs
    // updating as new music gets added in future years - maxYear is just
    // "today", recomputed on every call. The floor is a generous guess at
    // "older than this basically never comes up" rather than a real data
    // minimum - being off by a few decades there only nudges the color of a
    // handful of very old songs, it doesn't break anything.
    function yearToColor(year) {
      const MIN_YEAR = 1900;
      const maxYear = new Date().getFullYear();
      const t = Math.max(0, Math.min(1, (Number(year) - MIN_YEAR) / (maxYear - MIN_YEAR)));
      const hue = t * 270;
      // Saturation/lightness stay fixed so only the hue changes - keeps
      // white chip text readable at every point on the scale.
      return `hsl(${hue.toFixed(0)}, 70%, 42%)`;
    }

    function renderTimeline() {
      const list = document.getElementById('timelineList');
      list.innerHTML = '';
      timeline.forEach((song) => {
        const li = document.createElement('li');
        const color = yearToColor(song.year);
        li.style.borderLeftColor = color;

        const chip = document.createElement('span');
        chip.className = 'year-chip';
        chip.style.backgroundColor = color;
        chip.textContent = song.year;

        li.appendChild(chip);
        li.appendChild(document.createTextNode(` ${song.name} (${song.artists})`));
        list.appendChild(li);
      });
    }

    // Renders one big tappable button per option (replacing what used to be
    // a native <select> - a dropdown picker is fiddly on a phone mid-game and
    // doesn't read well). Only one button can be selected at a time; the
    // chosen value lives on the container's dataset instead of a form
    // control's .value, and submitBtn stays disabled until something's
    // picked. `extraDisableCheck`, if given, is re-checked on every click so
    // e.g. a steal button can stay disabled without tokens even once a gap
    // is picked.
    function buildOptionButtons(containerEl, options, submitBtn, extraDisableCheck) {
      containerEl.innerHTML = '';
      containerEl.dataset.selected = '';
      submitBtn.disabled = true;

      options.forEach(({ value, label }) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'secondary gap-option';
        btn.textContent = label;
        btn.addEventListener('click', () => {
          containerEl.querySelectorAll('.gap-option').forEach((b) => b.classList.remove('selected'));
          btn.classList.add('selected');
          containerEl.dataset.selected = value;
          submitBtn.disabled = extraDisableCheck ? extraDisableCheck() : false;
        });
        containerEl.appendChild(btn);
      });
    }

    // Builds one button per gap in a timeline (before the first card,
    // between each pair, and after the last one). Skips the gap between two
    // cards that share a year - it's always redundant, since whenever it's a
    // correct guess, both of its neighboring gaps are correct too.
    // `allowedIndices`, if given, further restricts which gaps show up (used
    // for steal attempts, where some of the active player's gaps are off
    // limits).
    function renderGapOptions(containerEl, refTimeline, allowedIndices, submitBtn) {
      const options = [];

      for (let i = 0; i <= refTimeline.length; i++) {
        if (i > 0 && i < refTimeline.length && refTimeline[i - 1].year === refTimeline[i].year) continue;
        if (allowedIndices && !allowedIndices.includes(i)) continue;

        let label;
        if (refTimeline.length === 0) {
          label = 'Only card';
        } else if (i === 0) {
          label = `Before ${refTimeline[0].year}`;
        } else if (i === refTimeline.length) {
          label = `After ${refTimeline[refTimeline.length - 1].year}`;
        } else {
          label = `Between ${refTimeline[i - 1].year} and ${refTimeline[i].year}`;
        }
        options.push({ value: i, label });
      }

      buildOptionButtons(containerEl, options, submitBtn);
    }

    // Steal options arrive pre-built (index + label) from the server, since
    // it already knows which of the active player's gaps are off-limits.
    function renderStealOptions(containerEl, stealOptions, submitBtn) {
      buildOptionButtons(
        containerEl,
        stealOptions.map(({ index, label }) => ({ value: index, label })),
        submitBtn,
        () => tokens <= 0
      );
    }

    function hideAllRoundSections() {
      document.getElementById('waitingSection').hidden = true;
      document.getElementById('guessSection').hidden = true;
      document.getElementById('stealSection').hidden = true;
      document.getElementById('resultSection').hidden = true;
    }

    document.getElementById('joinForm').addEventListener('submit', (event) => {
      event.preventDefault();

      const status = document.getElementById('status');
      const code = document.getElementById('roomCodeInput').value;
      const nickname = document.getElementById('nicknameInput').value.trim();

      if (!nickname) {
        status.textContent = 'Nickname is required.';
        return;
      }

      socket.emit('joinRoom', { code, nickname }, (response) => {
        if (response.error) {
          status.textContent = response.error;
        } else {
          status.textContent = `Joined room ${response.code} as ${nickname}`;
          roomCode = response.code;
          playerId = response.playerId;
          enterGame(nickname, response.timeline, response.tokens);
          saveSession(roomCode, playerId);
        }
      });
    });

    // A fresh game deals everyone one free starter card before round 1 begins.
    socket.on('starterCardsDealt', ({ dealt }) => {
      const mine = dealt.find((d) => d.playerId === playerId);
      if (!mine) return;

      timeline = [mine.song];
      renderTimeline();

      hideAllRoundSections();
      document.getElementById('waitingSection').hidden = false;
      document.getElementById('waitingSection').querySelector('p').textContent =
        `You got a starter card: ${mine.song.year} - ${mine.song.name}. Waiting for round 1...`;
    });

    // Server tells us a song started playing without revealing what it is.
    // Only the active player bets right now - everyone else waits to see the
    // steal window open once that bet is locked in.
    socket.on('roundStarted', ({ activePlayerId, activeNickname }) => {
      hasGuessed = false;
      hideAllRoundSections();

      if (activePlayerId === playerId) {
        renderGapOptions(document.getElementById('positionOptions'), timeline, null, document.getElementById('submitGuessBtn'));
        document.getElementById('guessPrompt').textContent = 'Your turn! Where does it belong on your timeline?';
        document.getElementById('guessSection').hidden = false;
      } else {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent =
          `${activeNickname}'s turn - waiting for their bet...`;
      }
    });

    document.getElementById('submitGuessBtn').addEventListener('click', () => {
      if (hasGuessed) return;

      const position = Number(document.getElementById('positionOptions').dataset.selected);
      socket.emit('submitGuess', { roomCode, position }, (response) => {
        if (response.error) {
          alert(response.error);
          return;
        }
        hasGuessed = true;
        document.getElementById('guessSection').hidden = true;
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Bet locked in - waiting for reveal...';
      });
    });

    // Active player's bet is in. Everyone else now gets a real (non-blind)
    // choice: spend a steal token on one of the active player's OWN timeline
    // gaps (their chosen gap and its neighbors are reserved - "the borders
    // are in their favor"), or pass for free.
    socket.on('stealWindowOpened', ({ activePlayerId, activeNickname, activeTimeline, stealOptions }) => {
      hideAllRoundSections();

      if (activePlayerId === playerId) {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Bet locked in - waiting for reveal...';
        return;
      }

      if (stealOptions.length === 0) {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent =
          `${activeNickname}'s bet covers their whole timeline - nothing left to steal this round.`;
        return;
      }

      document.getElementById('stealPrompt').textContent =
        `${activeNickname} placed their bet. Steal one of the remaining spots on their timeline (costs 1 token) or let it ride.`;

      renderStealOptions(document.getElementById('stealPositionOptions'), stealOptions, document.getElementById('submitStealBtn'));
      document.getElementById('stealSection').hidden = false;
    });

    document.getElementById('submitStealBtn').addEventListener('click', () => {
      const position = Number(document.getElementById('stealPositionOptions').dataset.selected);

      socket.emit('submitSteal', { roomCode, position }, (response) => {
        if (response.error) {
          alert(response.error);
          return;
        }
        setTokens(response.tokens);
        document.getElementById('stealSection').hidden = true;
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Steal attempt locked in - waiting for reveal...';
      });
    });

    document.getElementById('passStealBtn').addEventListener('click', () => {
      socket.emit('passSteal', { roomCode }, (response) => {
        if (response.error) {
          alert(response.error);
          return;
        }
        document.getElementById('stealSection').hidden = true;
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Waiting for reveal...';
      });
    });

    socket.on('roundResult', ({ song, activePlayerId, activeNickname, activeCorrect, activeTimeline, stealResults, winners }) => {
      hideAllRoundSections();

      if (playerId === activePlayerId) {
        timeline = activeTimeline;
        renderTimeline();
        document.getElementById('resultText').textContent = activeCorrect
          ? `Correct! ${song.name} (${song.artists}) - ${song.year}`
          : `You missed it. ${song.name} (${song.artists}) was actually from ${song.year}.`;
      } else {
        const mine = stealResults.find((result) => result.playerId === playerId);

        if (mine) {
          timeline = mine.timeline;
          renderTimeline();
        }

        if (activeCorrect) {
          document.getElementById('resultText').textContent = mine
            ? `${activeNickname} got it right - your steal attempt didn't get a chance. Token spent.`
            : `${activeNickname} got it right! ${song.name} (${song.artists}) - ${song.year}`;
        } else if (mine && mine.correct) {
          document.getElementById('resultText').textContent = `You stole it! ${song.name} (${song.artists}) - ${song.year}`;
        } else if (mine) {
          document.getElementById('resultText').textContent = `Steal failed. ${activeNickname} also missed it, but ${song.year} wasn't your guess. Token spent.`;
        } else {
          document.getElementById('resultText').textContent = `${activeNickname} missed it. ${song.name} (${song.artists}) - ${song.year}`;
        }
      }

      document.getElementById('resultSection').hidden = false;
      document.getElementById('waitingSection').hidden = false;

      let waitingText = 'Waiting for the next turn...';
      if (winners && winners.length > 0) {
        waitingText = winners.includes(myNickname)
          ? 'You won the game!'
          : `${winners.join(' & ')} won the game!`;
      }
      document.getElementById('waitingSection').querySelector('p').textContent = waitingText;
    });

    // Pushed by the server when the host approves a steal token after a
    // correct, correctly-named turn.
    socket.on('tokensUpdated', ({ tokens: newTokens }) => {
      setTokens(newTokens);
    });

    // Server resets everyone's view when the host starts a new game.
    socket.on('newGameStarted', ({ startingTokens }) => {
      timeline = [];
      hasGuessed = false;
      setTokens(startingTokens || 0);
      renderTimeline();
      hideAllRoundSections();
      document.getElementById('waitingSection').hidden = false;
      document.getElementById('waitingSection').querySelector('p').textContent = 'New game started - waiting for the next song...';
    });

    // Renders whichever section a round snapshot says this player should see
    // right now - used right after rejoining, since the live events that
    // normally drive this (roundStarted/stealWindowOpened) only fire for
    // sockets that were already connected when they happened.
    function applySnapshot(snapshot) {
      hideAllRoundSections();

      if (!snapshot || snapshot.phase === 'waiting') {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Waiting for the next song...';
        return;
      }

      if (snapshot.phase === 'primary') {
        if (snapshot.isActive) {
          hasGuessed = false;
          renderGapOptions(document.getElementById('positionOptions'), timeline, null, document.getElementById('submitGuessBtn'));
          document.getElementById('guessPrompt').textContent = 'Your turn! Where does it belong on your timeline?';
          document.getElementById('guessSection').hidden = false;
        } else {
          document.getElementById('waitingSection').hidden = false;
          document.getElementById('waitingSection').querySelector('p').textContent =
            `${snapshot.activeNickname}'s turn - waiting for their bet...`;
        }
        return;
      }

      // phase === 'steal'
      if (snapshot.isActive) {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Bet locked in - waiting for reveal...';
        return;
      }

      if (snapshot.alreadyDecided || snapshot.stealOptions.length === 0) {
        document.getElementById('waitingSection').hidden = false;
        document.getElementById('waitingSection').querySelector('p').textContent = 'Waiting for reveal...';
        return;
      }

      document.getElementById('stealPrompt').textContent =
        `${snapshot.activeNickname} placed their bet. Steal one of the remaining spots on their timeline (costs 1 token) or let it ride.`;

      renderStealOptions(document.getElementById('stealPositionOptions'), snapshot.stealOptions, document.getElementById('submitStealBtn'));
      document.getElementById('stealSection').hidden = false;
    }

    // Tries to silently resume the last room/identity this browser joined,
    // instead of showing the join form. Called on every 'connect' below -
    // not just the page's first load - because a dropped connection that
    // silently reconnects on its own (a network blip, common on mobile) gets
    // a brand-new socket.id without reloading the page. Without re-running
    // this, the server would have no idea which player that new socket.id
    // belongs to, and the very next guess/steal would fail with a confusing
    // "Only players can guess" until someone thought to manually refresh.
    function attemptRejoin() {
      const storedRoomCode = localStorage.getItem('mt_roomCode');
      const storedPlayerId = localStorage.getItem('mt_playerId');
      if (!storedRoomCode || !storedPlayerId) return;

      socket.emit('rejoinRoom', { roomCode: storedRoomCode, playerId: storedPlayerId }, (response) => {
        if (!response || response.error) {
          clearSession();
          return;
        }

        roomCode = response.code;
        playerId = response.playerId;
        enterGame(response.nickname, response.timeline, response.tokens);
        document.getElementById('status').textContent = `Reconnected to room ${roomCode} as ${response.nickname}`;
        applySnapshot(response);
      });
    }
  </script>
</body>
</html>
